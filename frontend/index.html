<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Elite Force (EForce) - Telegram Mini App" />
  <meta name="theme-color" content="#050816" />
  <meta name="color-scheme" content="dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval' blob:; style-src * 'unsafe-inline'; img-src * data: blob:; font-src * data:; connect-src *;" />

  <title>Elite Force (EForce) - Mini App</title>

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23050816' stroke='%2300E5FF' stroke-width='6'/%3E%3Cpolygon points='50,25 65,45 57,45 57,75 43,75 43,45 35,45' fill='%2300E5FF'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
  >
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- Load Telegram SDK SYNCHRONOUSLY so platform detection works instantly -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.lordicon.com/lordicon.js" defer></script>
</head>

<body class="bg-[#050816] text-white font-sans antialiased overflow-hidden select-none">
  <noscript></noscript>

  <!-- Instant PC/Desktop Blocker — runs BEFORE React -->
  <div id="pc-block-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:999999;background:linear-gradient(135deg,#0a0a1a 0%,#1a0a2e 30%,#0d1b2a 60%,#0a0a1a 100%);align-items:center;justify-content:center;flex-direction:column;font-family:Inter,sans-serif;">
    <div style="text-align:center;padding:24px;max-width:400px;">
      <img src="/desktop-blocked.svg" alt="Blocked" style="width:260px;max-width:85vw;margin:0 auto 20px;border-radius:16px;filter:drop-shadow(0 0 25px rgba(0,229,255,0.15));animation:pcFloat 3s ease-in-out infinite;" />
      <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,rgba(255,59,48,0.2),rgba(255,149,0,0.2));border:2px solid rgba(255,59,48,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;animation:pulse 2s ease-in-out infinite;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF3B30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <h2 style="font-size:18px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;text-shadow:0 0 20px rgba(255,59,48,0.3);">🚫 Desktop Access Blocked</h2>
      <p style="font-size:12px;color:rgba(255,255,255,0.55);line-height:1.6;max-width:280px;margin:0 auto 16px;">This app is only available on the <strong style="color:#00E5FF;">Telegram Mobile App</strong>. Please open from your phone's Telegram app.</p>
      <div style="width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);margin-bottom:14px;"></div>
      <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:12px 16px;">
        <p style="font-size:10px;color:rgba(255,255,255,0.35);line-height:1.5;margin:0;">📱 Open <strong style="color:#00E5FF;">Telegram</strong> on your mobile → Search for our bot → Tap <strong style="color:#00E5FF;">"Launch App"</strong></p>
      </div>
    </div>
    <style>
      @keyframes pcFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    </style>
  </div>

  <script>
    // ===== INSTANT PC/DESKTOP BLOCK =====
    // Runs AFTER Telegram SDK (loaded sync above) and BEFORE React
    (function() {
      var isAdmin = window.location.pathname.indexOf('advance-admin') !== -1 || window.location.pathname.indexOf('/admin') !== -1;
      if (isAdmin) return; // Admin panel always accessible from PC

      // Check admin toggle from localStorage (synced by React app)
      try {
        var stored = localStorage.getItem('eforce_blockDesktopWeb');
        if (stored === 'false') return; // Admin turned OFF the block
      } catch(e) {}
      // If stored is 'true' or null (first visit), proceed with blocking

      function blockPC() {
        var overlay = document.getElementById('pc-block-overlay');
        if (overlay) overlay.style.display = 'flex';
        var root = document.getElementById('root');
        if (root) root.style.display = 'none';
        window.__PC_BLOCKED__ = true;
      }

      // --- Check 1: Telegram WebApp platform (SDK is loaded sync, available now) ---
      try {
        var tgPlatform = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform || '').toLowerCase();
        if (['tdesktop','web','weba','webk','desktop','macos','unigram'].indexOf(tgPlatform) !== -1) {
          blockPC();
          return;
        }
        // If platform is android/ios, it's mobile — allow
        if (tgPlatform === 'android' || tgPlatform === 'ios') {
          return;
        }
      } catch(e) {}

      // --- Check 2: User Agent OS detection ---
      var ua = navigator.userAgent || '';
      var isMobileUA = /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua);

      // PC operating systems
      var isPCOS = /Windows NT|Macintosh|Mac OS X|CrOS|Linux x86_64|X11/i.test(ua) && !isMobileUA;
      if (isPCOS) {
        blockPC();
        return;
      }

      // --- Check 3: navigator.platform (legacy but reliable) ---
      var navPlatform = (navigator.platform || navigator.userAgentData?.platform || '').toLowerCase();
      var isPCPlatform = /win32|win64|windows|macintel|macppc|mac68k|linux x86|linux i686|linux amd64/i.test(navPlatform);
      if (isPCPlatform && !isMobileUA) {
        blockPC();
        return;
      }

      // --- Check 4: No touch + big screen = likely PC ---
      var noTouch = !('ontouchstart' in window) && (navigator.maxTouchPoints || 0) === 0;
      var bigScreen = window.innerWidth > 800 && window.innerHeight > 600;
      if (noTouch && bigScreen && !isMobileUA) {
        blockPC();
        return;
      }

      // --- Check 5: Referrer / ancestor origins (web.telegram.org) ---
      try {
        var ref = document.referrer || '';
        if (ref.indexOf('web.telegram.org') !== -1 || ref.indexOf('desktop.telegram.org') !== -1) {
          blockPC();
          return;
        }
        if (window.location.ancestorOrigins && window.location.ancestorOrigins.length > 0) {
          for (var i = 0; i < window.location.ancestorOrigins.length; i++) {
            if (window.location.ancestorOrigins[i].indexOf('telegram.org') !== -1) {
              blockPC();
              return;
            }
          }
        }
      } catch(e) {}

      // --- Check 6: Delayed re-check (safety net) ---
      setTimeout(function() {
        if (window.__PC_BLOCKED__) return;
        try {
          var p = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform || '').toLowerCase();
          if (['tdesktop','web','weba','webk','desktop','macos','unigram'].indexOf(p) !== -1) {
            blockPC();
          }
        } catch(e) {}
      }, 500);

      setTimeout(function() {
        if (window.__PC_BLOCKED__) return;
        try {
          var p = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform || '').toLowerCase();
          if (['tdesktop','web','weba','webk','desktop','macos','unigram'].indexOf(p) !== -1) {
            blockPC();
          }
        } catch(e) {}
      }, 2000);
    })();
  </script>

  <div id="root"></div>

  <script>
    // Suppress Chrome Extension injection errors from cluttering the console
    window.addEventListener('unhandledrejection', function(event) {
      const reasonStr = String(event.reason || '');
      const stackStr = String(event.reason?.stack || '');
      if (
        reasonStr.includes('chrome-extension://') ||
        stackStr.includes('chrome-extension://') ||
        reasonStr.includes('ContentScript')
      ) {
        event.preventDefault();
      }
    });

    window.onerror = function(msg, url) {
      if (url && url.includes('chrome-extension://')) {
        return true;
      }
    };
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
