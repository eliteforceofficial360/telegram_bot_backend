<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Elite Force (EForce) - Telegram Mini App" />
  <meta name="theme-color" content="#050816" />
  <meta name="color-scheme" content="dark" />

  <title>Elite Force (EForce) - Mini App</title>

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23050816' stroke='%2300E5FF' stroke-width='6'/%3E%3Cpolygon points='50,25 65,45 57,45 57,75 43,75 43,45 35,45' fill='%2300E5FF'/%3E%3C/svg%3E" />


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  
  <link rel="preload" as="image" href="/coin-logo.jpg" fetchpriority="high" />
  
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
  >
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="https://cdn.lordicon.com/lordicon.js" defer></script>
</head>

<body class="bg-[#050816] text-white font-sans antialiased overflow-hidden select-none">
  <noscript>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;background:#050816;color:#ffffff;font-family:sans-serif;">
      <div style="width:64px;height:64px;border-radius:16px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:#EF4444;font-size:28px;">⚡</div>
      <h2 style="font-size:20px;font-weight:900;color:#ffffff;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em;">JavaScript Required</h2>
      <p style="font-size:13px;color:#94a3b8;max-width:320px;line-height:1.6;margin-bottom:24px;">
        Elite Force requires JavaScript to launch. Please enable JavaScript in your browser settings and refresh the page.
      </p>
      <button onclick="window.location.reload()" style="background:linear-gradient(135deg,#FF8A00,#FFB347);border:none;color:#000000;padding:12px 28px;border-radius:14px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 0 20px rgba(255,138,0,0.3);">
        🔄 Refresh & Launch App
      </button>
    </div>
  </noscript>

  <div id="root">
    <!-- Instant Pre-React Loading Shell -->
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;width:100vw;background:#050816;color:#fff;font-family:'Inter',sans-serif;position:fixed;inset:0;z-index:9999;">
      <div style="position:relative;width:96px;height:96px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;">
        <div style="position:absolute;inset:0;border-radius:50%;background:rgba(255,138,0,0.15);filter:blur(20px);"></div>
        <div style="width:80px;height:80px;border-radius:50%;border:2px solid rgba(255,215,0,0.3);display:flex;align-items:center;justify-content:center;background:#050816;box-shadow:0 0 30px rgba(255,138,0,0.25);">
          <img src="/coin-logo.jpg" alt="Logo" style="width:100%;height:100%;object-fit:cover;border-radius:50%;padding:4px;" onError="this.style.display='none'" />
        </div>
      </div>
      <h1 style="font-size:18px;font-weight:900;letter-spacing:0.25em;color:#ffffff;text-transform:uppercase;margin:0;">ELITE FORCE</h1>
      <p style="font-size:10px;color:#64748b;font-weight:700;letter-spacing:0.3em;text-transform:uppercase;margin-top:8px;">WEB3 ECOSYSTEM v2.0</p>
      <div style="width:144px;height:4px;background:rgba(255,255,255,0.08);border-radius:999px;margin-top:32px;overflow:hidden;position:relative;">
        <div style="position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#00E5FF,#FF8A00);border-radius:999px;animation:efLoading 1.5s infinite ease-in-out;"></div>
      </div>
      <style>
        @keyframes efLoading {
          0% { left: -50%; width: 30%; }
          50% { left: 35%; width: 60%; }
          100% { left: 100%; width: 30%; }
        }
      </style>
    </div>
  </div>

  <script>
    // Suppress Chrome Extension injection errors from cluttering the console
    window.addEventListener('unhandledrejection', function(event) {
      const reasonStr = String(event.reason || '');
      const stackStr = String(event.reason?.stack || '');
      if (
        reasonStr.includes('chrome-extension://') ||
        stackStr.includes('chrome-extension://') ||
        reasonStr.includes('ContentScript')
      ) {
        event.preventDefault();
      }
    });

    window.onerror = function(msg, url) {
      if (url && url.includes('chrome-extension://')) {
        return true;
      }
    };
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
